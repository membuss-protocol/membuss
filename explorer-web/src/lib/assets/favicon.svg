<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Membuss — decentralized content network</title>
  <rect width="64" height="64" rx="8" fill="#0c1416"/>
  <!-- mesh links from the central node out to peers -->
  <g stroke="#57b79e" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="32" x2="16" y2="16"/>
    <line x1="32" y1="32" x2="48" y2="16"/>
    <line x1="32" y1="32" x2="16" y2="48"/>
    <line x1="32" y1="32" x2="48" y2="48"/>
  </g>
  <!-- peer nodes -->
  <g fill="#57b79e">
    <circle cx="16" cy="16" r="4.5"/>
    <circle cx="48" cy="16" r="4.5"/>
    <circle cx="16" cy="48" r="4.5"/>
    <circle cx="48" cy="48" r="4.5"/>
  </g>
  <!-- central (this) node -->
  <circle cx="32" cy="32" r="8" fill="#e8a33d" stroke="#0c1416" stroke-width="2"/>
</svg>
