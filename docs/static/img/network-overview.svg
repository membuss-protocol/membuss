<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-sub" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .flow-line { stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .wire { stroke: #30363d; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="360" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Swarm Container -->
  <rect x="220" y="24" width="440" height="88" rx="8" fill="url(#card-grad)" stroke="#388bfd" stroke-width="1.2"/>
  <text x="440" y="46" text-anchor="middle" class="title">🌐 P2P Swarm Network (libp2p &amp; Mem-DHT)</text>
  
  <!-- Device Badges -->
  <rect x="240" y="58" width="115" height="38" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="297" y="74" text-anchor="middle" class="node-title">💻 Device A</text>
  <text x="297" y="88" text-anchor="middle" class="subtitle">Daemon Node</text>

  <rect x="382" y="58" width="115" height="38" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="74" text-anchor="middle" class="node-title">🖥️ Device B</text>
  <text x="440" y="88" text-anchor="middle" class="subtitle">Anchor Node</text>

  <rect x="525" y="58" width="115" height="38" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="582" y="74" text-anchor="middle" class="node-title">📱 Device C</text>
  <text x="582" y="88" text-anchor="middle" class="subtitle">Mobile Edge</text>

  <line x1="355" y1="77" x2="382" y2="77" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="497" y1="77" x2="525" y2="77" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Swarm to Core Engine Arrow -->
  <path d="M 440 112 L 440 142" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Membuss Network Engine Central Hub -->
  <rect x="260" y="146" width="360" height="54" rx="8" fill="url(#card-grad)" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="440" y="169" text-anchor="middle" class="title">🌌 Membuss Network Substrate</text>
  <text x="440" y="187" text-anchor="middle" class="subtitle">Memex v2 Block Exchange · Routing · 3-Tier Scheduling</text>

  <!-- Distribution Lines -->
  <path d="M 440 200 L 440 224" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M 170 224 L 710 224" stroke="#8b949e" stroke-width="1.5"/>
  
  <path d="M 170 224 L 170 248" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-sub)"/>
  <path d="M 440 224 L 440 248" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-sub)"/>
  <path d="M 710 224 L 710 248" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-sub)"/>

  <!-- Card 1: Content-Addressed Storage -->
  <rect x="50" y="252" width="240" height="84" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="50" y="252" width="240" height="4" rx="2" fill="url(#accent-blue)"/>
  <text x="70" y="278" class="node-title">📦 Content-Addressed</text>
  <text x="70" y="298" class="node-desc">• Cryptographic Multihash (MID)</text>
  <text x="70" y="318" class="node-desc">• BLAKE3 UnixFS Merkle DAGs</text>

  <!-- Card 2: Resilient Erasure Coding -->
  <rect x="320" y="252" width="240" height="84" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="320" y="252" width="240" height="4" rx="2" fill="url(#accent-green)"/>
  <text x="340" y="278" class="node-title">🛡️ Reed-Solomon 10+4</text>
  <text x="340" y="298" class="node-desc">• 40% Peer Failure Immunity</text>
  <text x="340" y="318" class="node-desc">• Single-Pass Galois Field Coding</text>

  <!-- Card 3: Serverless Edge Compute -->
  <rect x="590" y="252" width="240" height="84" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="590" y="252" width="240" height="4" rx="2" fill="url(#accent-orange)"/>
  <text x="610" y="278" class="node-title">⚡ MemEdge Serverless</text>
  <text x="610" y="298" class="node-desc">• Wazero (WASI) &amp; Goja (JS)</text>
  <text x="610" y="318" class="node-desc">• &lt; 0.5ms Microsecond Cold Starts</text>
</svg>
